sonar.projectKey=tddlabteam2023_tddlabteam
sonar.organization=tddlabteam2023

# Monorepo analysis scope
sonar.sources=server/src,Web Ui/src
sonar.tests=server/test,Web Ui/test
sonar.test.inclusions=server/test/**/*.test.ts,Web Ui/test/**/*.{test,spec}.{ts,tsx,js,jsx}

# Ignore generated/build artifacts
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.vscode-test/**

# Import Jest coverage from backend and frontend
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,Web Ui/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=TDDLabTeam
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
